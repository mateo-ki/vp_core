name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # ipstack 的 build.rs 在 Windows 会把 wintun.dll 拷贝到 target/<profile>/examples/
      # 但不创建父目录——全新 CI target 目录必然 NotFound (os error 3)。此处预建。
      - name: Prepare target examples dir (ipstack build script workaround)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p target/debug/examples

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --verbose

      - name: Gate-check bundled .vp DSL example (validate + fmt --check)
        shell: bash
        run: |
          cargo run -q -p vp-bin -- validate -c example/config.vp
          cargo run -q -p vp-bin -- fmt --check example/config.vp
