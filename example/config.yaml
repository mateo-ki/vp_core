rule-providers:
  # 文本域名集（+.google.com 语法）；classical/ipcidr 行为同样支持
  # my-direct:
  #   behavior: domain
  #   path: rules/direct.list
  #   interval: 86400

rules:
  # - RULE-SET,my-direct,DIRECT
  # - GEOSITE,cn,DIRECT        # 需要 geosite.dat
  # - GEOIP,CN,DIRECT          # 需要 geoip.metadb / Country.mmdb
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
