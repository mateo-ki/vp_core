name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: vpcore.exe
            archive_format: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_name: vpcore
            archive_format: tar.gz
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            bin_name: vpcore
            archive_format: tar.gz
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: vpcore
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: vpcore
            archive_format: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest' && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if needed)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build CLI Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p vp-bin
          else
            cargo build --release --target ${{ matrix.target }} -p vp-bin
          fi
        shell: bash

      - name: Prepare Artifact Package
        id: package
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-snapshot}"
          PKG_NAME="vpcore-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"

          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          cp "${BIN_PATH}" "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/" 2>/dev/null || true
          cp LICENSE "dist/${PKG_NAME}/" 2>/dev/null || true

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            curl -sL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
            7z e wintun.zip wintun/bin/amd64/wintun.dll -o"dist/${PKG_NAME}/" -y
          fi

          cd dist
          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            7z a "${PKG_NAME}.zip" "${PKG_NAME}"
            cp "${PKG_NAME}.zip" "vpcore-${{ matrix.target }}.zip"
            echo "archive=${PKG_NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
            cp "${PKG_NAME}.tar.gz" "vpcore-${{ matrix.target }}.tar.gz"
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
              cp "${PKG_NAME}.tar.gz" "vpcore-x86_64-unknown-linux-gnu.tar.gz"
            fi
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              cp "${PKG_NAME}.tar.gz" "vpcore-aarch64-unknown-linux-gnu.tar.gz"
            fi
            echo "archive=${PKG_NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/vpcore-${{ matrix.target }}.*
            dist/vpcore-*-unknown-linux-gnu.tar.gz

  build-android:
    name: Build Mobile (Android)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Android NDK & targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Android Shared Libraries (.so) & Package SDK
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o dist/android/jniLibs build --release -p vp-ffi
          mkdir -p dist/android/include dist/android/kotlin/com/vpcore
          cp crates/vp-ffi/include/vpcore.h dist/android/include/
          cp mobile/android/com/vpcore/VPCore.kt dist/android/kotlin/com/vpcore/
          cp mobile/android/README.md dist/android/

          TAG_NAME="${GITHUB_REF_NAME:-snapshot}"
          cd dist
          zip -r "vpcore-android-${TAG_NAME}.zip" android
          cp "vpcore-android-${TAG_NAME}.zip" vpcore-android.zip
          # 兼容保留历史包名 (过渡2个版本)
          tar -czvf vpcore-android-ffi.tar.gz android/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: |
            dist/vpcore-android-*.zip
            dist/vpcore-android.zip
            dist/vpcore-android-ffi.tar.gz

  build-ios:
    name: Build Mobile (iOS)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up iOS targets
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - name: Build iOS Static Libraries & Package Framework
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: |
          cargo rustc --release --target aarch64-apple-ios -p vp-ffi --crate-type staticlib
          cargo rustc --release --target aarch64-apple-ios-sim -p vp-ffi --crate-type staticlib
          cargo rustc --release --target x86_64-apple-ios -p vp-ffi --crate-type staticlib || true

          mkdir -p dist/ios/include
          cp crates/vp-ffi/include/vpcore.h dist/ios/include/
          cp crates/vp-ffi/include/module.modulemap dist/ios/include/

          # 创建 iOS 模拟器通用库 (兼容 Xcode 15/16 纯 arm64 模拟器或传统 fat 库)
          mkdir -p dist/ios/sim
          if [ -f target/x86_64-apple-ios/release/libvpcore.a ]; then
            lipo -create \
              target/aarch64-apple-ios-sim/release/libvpcore.a \
              target/x86_64-apple-ios/release/libvpcore.a \
              -output dist/ios/sim/libvpcore.a || cp target/aarch64-apple-ios-sim/release/libvpcore.a dist/ios/sim/libvpcore.a
          else
            cp target/aarch64-apple-ios-sim/release/libvpcore.a dist/ios/sim/libvpcore.a
          fi

          # 创建 iOS 真机库
          mkdir -p dist/ios/device
          cp target/aarch64-apple-ios/release/libvpcore.a dist/ios/device/

          # 打包 XCFramework
          rm -rf dist/ios/VPCore.xcframework
          xcodebuild -create-xcframework \
            -library dist/ios/device/libvpcore.a -headers dist/ios/include \
            -library dist/ios/sim/libvpcore.a -headers dist/ios/include \
            -output dist/ios/VPCore.xcframework

          # 整合独立 iOS SDK 发布包目录
          mkdir -p dist/ios-pkg/Swift
          cp -r dist/ios/VPCore.xcframework dist/ios-pkg/
          cp -r dist/ios/include dist/ios-pkg/
          cp mobile/ios/Sources/VPCore/VPCore.swift dist/ios-pkg/Swift/
          cp mobile/ios/Package.swift dist/ios-pkg/
          cp mobile/ios/README.md dist/ios-pkg/

          TAG_NAME="${GITHUB_REF_NAME:-snapshot}"
          cd dist
          cd ios-pkg
          zip -r "../vpcore-ios-${TAG_NAME}.zip" *
          cd ..
          cp "vpcore-ios-${TAG_NAME}.zip" vpcore-ios.zip
          # 兼容保留历史包名 (过渡2个版本)
          cd ios
          zip -r ../vpcore-ios-xcframework.zip VPCore.xcframework
          cd ..

      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: |
            dist/vpcore-ios-*.zip
            dist/vpcore-ios.zip
            dist/vpcore-ios-xcframework.zip

  build-harmonyos:
    name: Build Mobile (HarmonyOS NEXT)
    runs-on: ubuntu-latest
    needs: [ build-android ]
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Built Libraries
        uses: actions/download-artifact@v4
        with:
          name: mobile-android
          path: download-android

      - name: Package HarmonyOS NEXT SDK
        run: |
          tar -xzvf download-android/vpcore-android-ffi.tar.gz

          mkdir -p dist/harmonyos/libs/arm64-v8a dist/harmonyos/libs/x86_64
          mkdir -p dist/harmonyos/include dist/harmonyos/arkts dist/harmonyos/cpp

          cp android/jniLibs/arm64-v8a/libvpcore.so dist/harmonyos/libs/arm64-v8a/
          cp android/jniLibs/x86_64/libvpcore.so dist/harmonyos/libs/x86_64/
          cp crates/vp-ffi/include/vpcore.h dist/harmonyos/include/
          cp mobile/harmonyos/arkts/* dist/harmonyos/arkts/
          cp mobile/harmonyos/cpp/* dist/harmonyos/cpp/
          cp mobile/harmonyos/CMakeLists.txt dist/harmonyos/
          cp mobile/harmonyos/README.md dist/harmonyos/

          TAG_NAME="${GITHUB_REF_NAME:-snapshot}"
          cd dist
          zip -r "vpcore-harmonyos-${TAG_NAME}.zip" harmonyos
          cp "vpcore-harmonyos-${TAG_NAME}.zip" vpcore-harmonyos.zip
          tar -czvf "vpcore-harmonyos-${TAG_NAME}.tar.gz" harmonyos/
          cp "vpcore-harmonyos-${TAG_NAME}.tar.gz" vpcore-harmonyos.tar.gz

      - name: Upload HarmonyOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harmonyos
          path: |
            dist/vpcore-harmonyos-*.zip
            dist/vpcore-harmonyos.zip
            dist/vpcore-harmonyos-*.tar.gz
            dist/vpcore-harmonyos.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [ build-desktop, build-android, build-ios, build-harmonyos ]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-desktop.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Release Notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release_assets
          if [ -f "RELEASE_NOTES.md" ]; then
            python3 -c "
          import re, sys
          ver = sys.argv[1]
          with open('RELEASE_NOTES.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'(?ms)(^#[ \t]+[^\r\n]*?\bv' + re.escape(ver) + r'\b[^\r\n]*\r?\n.*?)(?=\r?\n---\r?\n|\Z)'
          m = re.search(pattern, content)
          if m:
              with open('release_assets/release_notes.md', 'w', encoding='utf-8') as out:
                  out.write(m.group(1).strip())
              print('Extracted release notes for v' + ver)
          else:
              print('No matching notes found for v' + ver)
          " "$VERSION"
          fi
          if [ -s "release_assets/release_notes.md" ]; then
            echo "has_notes=true" >> $GITHUB_OUTPUT
          else
            echo "has_notes=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: VP_Core ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'release_assets/release_notes.md' || '' }}
          files: |
            release_assets/*
          generate_release_notes: false
          draft: false
          prerelease: false
