[workspace]
resolver = "2"
members = [
    "crates/vp-common",
    "crates/vp-core",
    "crates/vp-config",
    "crates/vp-rule",
    "crates/vp-router",
    "crates/vp-dns",
    "crates/vp-transport",
    "crates/vp-crypto",
    "crates/vp-protocol",
    "crates/vp-tun",
    "crates/vp-plugin",
    "crates/vp-plugin-sdk",
    "crates/vp-app",
    "crates/vp-ffi",
    "crates/vp-bin",
    "crates/examples/plugins/xor_mask",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# 内部 crate
vp-common = { path = "crates/vp-common" }
vp-core = { path = "crates/vp-core" }
vp-config = { path = "crates/vp-config" }
vp-rule = { path = "crates/vp-rule" }
vp-router = { path = "crates/vp-router" }
vp-dns = { path = "crates/vp-dns" }
vp-transport = { path = "crates/vp-transport" }
vp-crypto = { path = "crates/vp-crypto" }
vp-protocol = { path = "crates/vp-protocol" }
vp-tun = { path = "crates/vp-tun" }
vp-plugin = { path = "crates/vp-plugin" }
vp-plugin-sdk = { path = "crates/vp-plugin-sdk" }
vp-app = { path = "crates/vp-app" }

# 异步与 IO
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
    "signal",
    "fs",
] }
bytes = "1"
async-trait = "0.1"
pin-project-lite = "0.2"

# 序列化 / 配置
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
json5 = "0.4"
serde_path_to_error = "0.1"

# 错误 / 日志
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

# 密码学（RustCrypto 家族，保持小体积）
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
aes = "0.8"
chacha20poly1305 = "0.10"
poly1305 = "0.8"
universal-hash = "0.5"
blake3 = "1"
base64 = "0.22"
rand = "0.9"
x25519-dalek = { version = "2.0.0-rc.3", default-features = false, features = ["static_secrets"] }

# 网络
httparse = "1"
h2 = "0.4"
quinn = "0.11"
http = "1"
tun = { version = "0.8", features = ["async"] }
ipstack = "1.0"
etherparse = "0.17"
socket2 = "0.6"
boringtun = { version = "0.6", default-features = false }
smoltcp = { version = "0.11", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp"] }
maxminddb = "0.24"

# CLI
ureq = { version = "2", features = ["tls"] }
clap = { version = "4", features = ["derive", "std", "help", "usage", "error-context"] }

# 插件宿主
libloading = "0.8"

# 规则正则（可裁剪）
regex = "1"

# 平台
libc = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Threading",
] }

# 仅测试
rcgen = "0.13"

[profile.release]
# 极致小 + 快（实测与 opt-3 吞吐无差异，体积 -27%）：
#   lto=fat + codegen-units=1 跨 crate 全局优化
#   opt-level=z 体积优先；strip 去符号
# 注意：不用 panic="abort" —— 单个连接的 panic 只终止该 tokio 任务，
# 内核进程必须存活（稳定性优先）
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "z"

[profile.bench]
debug = false
