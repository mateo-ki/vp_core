# VP_Core 示例配置（Clash 兼容语法；同一份结构也支持 JSON/JSON5）
mixed-port: 7890            # HTTP + SOCKS5 同端口
allow-lan: false
mode: rule
log-level: info
ipv6: false

# 外部控制器（Clash 兼容 REST API）
external-controller: 127.0.0.1:9090
secret: ""

# 性能与套接字参数调优（可显著提升跨洋高延迟和高带宽吞吐）
tuning:
  socket-buffer-size: 524288  # 512KB SO_RCVBUF / SO_SNDBUF
  tcp-nodelay: true           # 禁用 Nagle 降低交互延迟
  tcp-keepalive-secs: 60      # 保活探活周期 (秒)

dns:
  enable: true
  # 留空则使用系统解析
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 兜底 DNS（nameserver 被污染或解析异常时使用）
  # fallback:
  #   - 1.1.1.1
  #   - 8.8.8.8
  # nameserver-policy 专有分流策略（域名通配符或 geosite 映射至独立上游）
  # nameserver-policy:
  #   "*.google.com,+.youtube.com": "https://dns.google/dns-query"
  #   "geosite:cn": "223.5.5.5"
  # fallback-filter 污染过滤与国外域名防污染
  # fallback-filter:
  #   geoip: true
  #   geoip-code: CN
  #   ipcidr:
  #     - 240.0.0.0/4
  #     - 127.0.0.1/32
  #   domain:
  #     - "+.twitter.com"

proxies:
  # Shadowsocks（AEAD 与 2022 系均支持）
  - name: "ss-示例"
    type: ss
    server: server.example.com
    port: 8388
    cipher: aes-256-gcm
    password: "your-password"
    udp: true

  # VMess（AEAD 头，ws/tcp、tls 均支持）
  - name: "vmess-示例"
    type: vmess
    server: v.example.com
    port: 443
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    alterId: 0
    cipher: auto
    tls: true
    servername: v.example.com
    network: ws
    ws-opts:
      path: /path
      headers:
        Host: v.example.com

  # VLESS（支持 flow: xtls-rprx-vision 真实流控）
  - name: "vless-示例"
    type: vless
    server: vl.example.com
    port: 443
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    tls: true
    flow: xtls-rprx-vision
    network: tcp

  # Snell（Surge / Clash.Meta 原生协议，支持 v1-v4、HTTP 混淆、UDP）
  - name: "snell-示例"
    type: snell
    server: sn.example.com
    port: 1234
    psk: "your-snell-psk"
    version: 4
    obfs-opts:
      mode: http
      host: www.bing.com
    udp: true

  # Trojan
  - name: "trojan-示例"
    type: trojan
    server: t.example.com
    port: 443
    password: "your-password"
    sni: t.example.com
    skip-cert-verify: false

  # 链式代理跳板（中转落地机）
  - name: "chained-trojan-示例"
    type: trojan
    server: landing.example.com
    port: 443
    password: "your-password"
    sni: landing.example.com
    dialer-proxy: "ss-示例"     # 流量通过前置 ss-示例 节点隧道转发

  # smux 多路复用节点示例
  - name: "vless-smux-示例"
    type: vless
    server: vl.example.com
    port: 443
    uuid: b831381d-6324-4d53-ad4f-8cda48b30811
    tls: true
    smux:
      enable: true
      max-streams: 16
      max-connections: 4

# 代理集合提供者（对标 Clash.Meta / mihomo proxy-providers）
# proxy-providers:
#   airport-sub:
#     type: http
#     url: "https://example.com/api/v1/client/subscribe?token=xxx"
#     path: ./proxy_provider/airport.yaml
#     interval: 3600
#     filter: "^(HK|TW|SG|JP)"
#     health-check:
#       enable: true
#       url: http://www.gstatic.com/generate_204
#       interval: 300

proxy-groups:
  - name: PROXY
    type: select
    # 支持 use 动态汇入 proxy-providers 中的全部节点
    # use:
    #   - airport-sub
    proxies:
      - 自动选择
      - ss-示例
      - vless-示例
      - snell-示例
      - DIRECT

  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - vmess-示例
      - vless-示例
      - snell-示例
      - trojan-示例

